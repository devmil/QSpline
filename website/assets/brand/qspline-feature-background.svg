      <stop offset="0.55" stop-color="#52c7c4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e0ad55" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#field)"/>
  <rect width="1200" height="630" fill="url(#blue-glow)"/>
  <rect width="1200" height="630" fill="url(#green-glow)"/>

  <g fill="none" stroke-linecap="round">
