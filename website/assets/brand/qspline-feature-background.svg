    <path d="M-60 72 H242 C476 72 414 512 680 512 H814 C1018 512 1000 206 1260 206" stroke="url(#secondary-lane)" stroke-width="3"/>
    <path d="M-50 620 C204 620 250 402 470 402 H760 C934 402 956 548 1250 548" stroke="#5ed59a" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M-48 284 H188 C352 284 380 390 544 390 H760 C950 390 992 72 1248 72" stroke="#e0ad55" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <g fill="#10151d" stroke-width="3">
    <circle cx="412" cy="132" r="9" stroke="#7cb2ff" stroke-opacity="0.34"/>
    <circle cx="904" cy="448" r="8" stroke="#5ed59a" stroke-opacity="0.30"/>
    <circle cx="464" cy="216" r="6" stroke="#7cb2ff" stroke-opacity="0.22"/>
    <circle cx="680" cy="512" r="8" stroke="#52c7c4" stroke-opacity="0.28"/>
    <circle cx="760" cy="390" r="6" stroke="#e0ad55" stroke-opacity="0.20"/>
