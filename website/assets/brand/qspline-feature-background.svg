<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">QSpline feature graphic background</title>
  <desc id="desc">A dark field with quiet, curved commit lanes and softly colored nodes.</desc>
  <defs>
    <linearGradient id="field" x1="70" y1="20" x2="1130" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171d27"/>
      <stop offset="0.52" stop-color="#10151d"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(174 536) rotate(-35) scale(500 338)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#447fc8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#447fc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green-glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 98) rotate(145) scale(430 292)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44a979" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#44a979" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primary-lane" x1="-70" y1="486" x2="1260" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cb2ff" stop-opacity="0.08"/>
      <stop offset="0.44" stop-color="#7cb2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ed59a" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="secondary-lane" x1="70" y1="70" x2="1180" y2="560" gradientUnits="userSpaceOnUse">
